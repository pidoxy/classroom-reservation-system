# Acceptance tests as data. Source of truth for what each step must satisfy.
# Human-readable version: docs/brief/acceptance-tests.md
# 'steps' lists the build steps in which the test must pass (docs/brief/build-order.md).
acceptance_tests:
- id: T-R1
  steps:
  - 2
  given: Rooms A (cap 4, projector), B (cap 10, whiteboard), C (cap 10, projector) are free tomorrow 14:00
    to 16:00
  when: Student searches that range with min_capacity 8 and amenity projector
  then: Only C is returned
- id: T-R2
  steps:
  - 2
  - 5
  given: Room A has a booking 14:00 to 15:00 tomorrow
  when: Student searches 14:30 to 15:30
  then: A is not returned; response has `as_of` within 5 s
- id: T-R3
  steps:
  - 2
  given: Room A free from 09:30, room B free from 10:30
  when: Student opens Available soon
  then: A listed before B; rooms free only after 11:00 absent
- id: T-R4
  steps:
  - 4
  given: Student has 2 upcoming bookings and 3 used this week
  when: Student opens My bookings and My standing
  then: 2 bookings soonest first; used 3, limit 5
- id: T-R5
  steps:
  - 3
  given: Room open 08:00 to 22:00
  when: Student books 10:00 to 13:00
  then: 201, status CONFIRMED
- id: T-R5b
  steps:
  - 3
  given: Same room
  when: Student books 10:00 to 13:30
  then: 422 `DURATION_NOT_ALLOWED`
- id: T-R6
  steps:
  - 1
  - 3
  given: Active booking 10:00 to 11:00 on room A
  when: Another student books A 10:30 to 11:00
  then: 409 `SLOT_TAKEN`; one booking stored
- id: T-R7
  steps:
  - 3
  given: Valid request
  when: Student books
  then: Status is CONFIRMED immediately; no pending state exists
- id: T-R8
  steps:
  - 3
  given: Student holds an active booking on A tomorrow
  when: Student books A for the day after
  then: 409 `ALREADY_BOOKED_THIS_ROOM`
- id: T-R9
  steps:
  - 3
  given: Student has 5 non-cancelled bookings starting this week
  when: Student books a sixth this week
  then: 422 `WEEKLY_LIMIT_REACHED` with `resets_at` = next Monday 00:00
- id: T-R10
  steps:
  - 3
  given: None
  when: Two identical POSTs with the same key 50 ms apart
  then: First 201, second 200 with the same booking id; one row
- id: T-R11
  steps:
  - 4
  given: Booking starts in 2 h
  when: Student cancels
  then: 200 CANCELLED; a search for that slot now returns the room
- id: T-R12
  steps:
  - 6
  given: Booking starts at 10:00
  when: Student checks in at 09:52
  then: 200 CHECKED_IN
- id: T-R12b
  steps:
  - 6
  given: Same
  when: Student checks in at 09:45
  then: 409 `TOO_EARLY`
- id: T-R13
  steps:
  - 6
  given: Booking 10:00 to 12:00, no check-in
  when: Clock reaches 10:16
  then: Status NO_SHOW; room searchable 10:30 to 12:00; penalty row written
- id: T-R14
  steps:
  - 6
  given: T-R13 has happened
  when: Another student opens Just released
  then: The 10:30 to 12:00 slot for that room is listed
- id: T-R15
  steps:
  - 6
  given: Student has 2 no-shows in the last 30 days
  when: A third no-show is recorded
  then: '`suspended_until` = now + 7 days; POST /bookings returns 403 `SUSPENDED`; search returns 200'
- id: T-R16
  steps:
  - 7
  given: None
  when: Student books, then cancels
  then: Two notifications in the outbox, each sent once
- id: T-R17
  steps:
  - 7
  given: Booking at 15:00
  when: Clock reaches 14:00
  then: One reminder sent between 14:00 and 14:02
- id: T-R17b
  steps:
  - 7
  given: Booking at 15:00 cancelled at 13:30
  when: Clock reaches 14:00
  then: No reminder sent
- id: T-R18
  steps:
  - 8
  given: Downtime announced for Saturday 02:00 to 04:00; student has a booking Saturday 03:00
  when: Announcement is published
  then: Student notified; banner shown on app open; `GET /announcements` lists it
- id: T-R19
  steps:
  - 9
  given: Database seeded with 300 rooms and 14 days of realistic bookings
  when: Load test at 50 searches per second for 10 min
  then: Search p95 under 1 s
- id: T-R20
  steps:
  - 3
  given: Weekly limit policy changed from 5 to 3
  when: Student with 3 bookings this week books again
  then: 422 `WEEKLY_LIMIT_REACHED`, with no deploy
- id: T-E1
  steps:
  - 1
  - 3
  given: Room A free 10:00 to 11:00
  when: 50 parallel requests from 50 students for A 10:00 to 11:00
  then: Exactly one 201; 49 `SLOT_TAKEN`; one row
- id: T-E3
  steps:
  - 3
  given: Booking created; response lost
  when: App retries with the same key
  then: 200 with the original booking
- id: T-E5
  steps:
  - 1
  given: Booking 10:00 to 11:00 on A
  when: Another student books A 11:00 to 12:00
  then: '201'
- id: T-E6
  steps:
  - 5
  given: Replica lags 3 s; A just booked on the primary
  when: Search shows A; student books A
  then: 409 `SLOT_TAKEN`
- id: T-E8
  steps:
  - 4
  given: Student made 5 bookings this week and cancelled 2
  when: Student books again
  then: '201'
- id: T-E11
  steps:
  - 4
  given: Booking started 5 min ago
  when: Student cancels
  then: 409 `ALREADY_STARTED`
- id: T-E15
  steps:
  - 3
  given: None
  when: Student books 10:10 to 11:10
  then: 422 `OFF_GRID`
- id: T-E17
  steps:
  - 8
  given: Room A has 3 future bookings
  when: Room A deactivated by import
  then: All 3 CANCELLED with actor system; 3 notifications queued
- id: T-E19
  steps:
  - 7
  given: Notification provider returns errors
  when: Student books
  then: 201; outbox row retried until the provider recovers; sent once
- id: T-E20
  steps:
  - 8
  given: Primary stopped
  when: Student searches, then books
  then: Search 200 with banner; book 503 `SERVICE_UNAVAILABLE`
- id: T-E21
  steps:
  - 3
  given: Key K used to book room A
  when: Same key K sent for room B
  then: 422 `IDEMPOTENCY_KEY_REUSED`
- id: T-E22
  steps:
  - 6
  given: Booking inside check-in window
  when: Check-in sent twice
  then: Both 200; one state change event
